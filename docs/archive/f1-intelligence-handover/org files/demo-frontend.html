<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Intelligence - Paddock Picks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #e3000b 0%, #ff1e25 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 24px;
        }
        
        .quick-questions {
            margin-bottom: 24px;
        }
        
        .quick-questions h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        
        .question-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .chip {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .chip:hover {
            background: #e3000b;
            color: white;
            border-color: #e3000b;
        }
        
        .input-section {
            margin-bottom: 24px;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #e3000b;
        }
        
        button {
            padding: 14px 24px;
            background: #e3000b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #c20009;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e3000b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            background: #f8f9fa;
            border-left: 4px solid #e3000b;
            padding: 20px;
            border-radius: 8px;
            margin-top: 16px;
        }
        
        .result h3 {
            color: #e3000b;
            margin-bottom: 12px;
            font-size: 18px;
        }
        
        .answer {
            line-height: 1.6;
            color: #333;
            margin-bottom: 16px;
        }
        
        .sources {
            border-top: 1px solid #e0e0e0;
            padding-top: 12px;
        }
        
        .sources h4 {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
        }
        
        .source-item {
            font-size: 13px;
            color: #666;
            padding: 4px 0;
        }
        
        .error {
            background: #fee;
            border-left: 4px solid #e3000b;
            padding: 16px;
            border-radius: 8px;
            color: #c20009;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏁 F1 Intelligence</h1>
            <p>Get instant insights powered by historical F1 data</p>
        </div>
        
        <div class="content">
            <div class="quick-questions">
                <h3>Quick Questions</h3>
                <div class="question-chips">
                    <div class="chip" onclick="askQuestion('How does Verstappen perform at Monaco?')">
                        Verstappen at Monaco?
                    </div>
                    <div class="chip" onclick="askQuestion('Best overtaking opportunities at Spa?')">
                        Spa overtaking zones?
                    </div>
                    <div class="chip" onclick="askQuestion('Red Bull reliability on street circuits?')">
                        Red Bull reliability?
                    </div>
                    <div class="chip" onclick="askQuestion('Hamilton podium rate at Silverstone?')">
                        Hamilton at Silverstone?
                    </div>
                </div>
            </div>
            
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="questionInput" 
                        placeholder="Ask about drivers, circuits, strategies, weather..."
                        onkeypress="handleKeyPress(event)"
                    />
                    <button onclick="askCustomQuestion()">Ask</button>
                </div>
            </div>
            
            <div id="output"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/f1-intelligence';
        
        async function askQuestion(question) {
            const output = document.getElementById('output');
            const input = document.getElementById('questionInput');
            
            // Update input to show what was asked
            input.value = question;
            
            // Show loading state
            output.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing F1 data...</p>
                </div>
            `;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Display result
                output.innerHTML = `
                    <div class="result">
                        <h3>💡 Insight</h3>
                        <div class="answer">${data.answer}</div>
                        <div class="sources">
                            <h4>Sources</h4>
                            ${data.sources.map((source, i) => `
                                <div class="source-item">
                                    ${i + 1}. ${source.title}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                output.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> Unable to connect to F1 Intelligence service. 
                        Make sure the API server is running on port 3001.
                    </div>
                `;
            }
        }
        
        function askCustomQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            
            if (!question) {
                alert('Please enter a question');
                return;
            }
            
            askQuestion(question);
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                askCustomQuestion();
            }
        }
    </script>
</body>
</html>
