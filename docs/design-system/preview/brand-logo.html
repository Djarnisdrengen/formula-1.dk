<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.brand-block { display:flex; align-items:center; gap:18px; padding: 8px 4px; }
.brand-block img { height: 64px; width: auto; object-fit: contain; }
.brand-text { display:flex; flex-direction:column; gap:2px; }
.brand-name { font-family:var(--font-display); font-weight:800; font-size: 22px; letter-spacing: -0.01em; }
.brand-year { font-family:var(--font-display); color: var(--text-muted); font-size: 13px; }
.brand-sub { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
.swatch.tonal { background: var(--bg-card); }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="brand-block">
    <img src="../assets/logo.png" alt="F1 Klub mark">
    <div class="brand-text">
      <div class="brand-name">Frederikssund Formel 1 Klub</div>
      <div class="brand-year">2026 Season</div>
      <div class="brand-sub">F1-car silhouette · red <span style="color:var(--f1-red)">●</span> &nbsp; white on dark</div>
    </div>
  </div>
</div></body></html>
