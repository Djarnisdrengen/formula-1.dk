<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.row { gap: 14px; }
.swatch-lg { width: 130px; height: 92px; }
.swatch.red  { background: var(--f1-red); }
.swatch.redD { background: var(--f1-red-dark); }
.swatch.redL { background: var(--f1-red-light); }
.swatch.tint10 { background: rgba(225, 6, 0, 0.10); color: #f5f5f7; }
.swatch.tint10 .hex { color: rgba(255,255,255,0.55); }
.swatch.tint30 { background: rgba(225, 6, 0, 0.30); color: #f5f5f7; }
.swatch.tint30 .hex { color: rgba(255,255,255,0.6); }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="label-tiny">Brand red · the throughline</div>
  <div class="row">
    <div class="swatch swatch-lg red">--f1-red<span class="hex">#e10600</span></div>
    <div class="swatch swatch-lg redD">--f1-red-dark<span class="hex">#b30500</span></div>
    <div class="swatch swatch-lg redL">--f1-red-light<span class="hex">#ff1a14</span></div>
    <div class="swatch swatch-lg tint10">10% tint<span class="hex">on dark bg</span></div>
    <div class="swatch swatch-lg tint30">30% tint<span class="hex">btn shadow</span></div>
  </div>
</div></body></html>
