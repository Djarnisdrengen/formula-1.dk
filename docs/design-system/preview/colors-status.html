<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="dark"><div class="card-frame">
  <div class="label-tiny">Status badges · always gradient, always uppercase</div>
  <div class="row">
    <span class="badge status-open">Betting Open</span>
    <span class="badge status-closed">Betting Closed</span>
    <span class="badge status-pending">Pending</span>
    <span class="badge status-completed">Completed</span>
    <span class="badge status-pool-won">Pool Won</span>
  </div>
  <div class="row" style="gap: 28px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-muted)">
    <span>--status-success #059669</span>
    <span>--status-danger #dc2626</span>
    <span>--status-warning #d97706</span>
    <span>--status-neutral #6b7280</span>
    <span>--gold #fbbf24</span>
  </div>
</div></body></html>
