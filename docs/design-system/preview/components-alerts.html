<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.alert { padding: 1rem 1.1rem; border-radius: 8px; font-size: 14px; font-weight: 500; }
.alert-success { background: rgba(5, 150, 105, 0.2); border: 1px solid #059669; color: #10b981; }
.alert-error   { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #ef4444; }
.alert-warning { background: rgba(217, 119, 6, 0.2); border: 1px solid #d97706; color: #f59e0b; }
.col { gap: 10px; }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="label-tiny">Alerts · success, error, warning</div>
  <div class="col">
    <div class="alert alert-success">Bet placed!</div>
    <div class="alert alert-error">Bet cannot match qualifying result</div>
    <div class="alert alert-warning">Betting closes in 12 minutes</div>
  </div>
</div></body></html>
