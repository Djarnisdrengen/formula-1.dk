<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.hero {
    text-align: center;
    padding: 2.4rem 1.5rem;
    background: var(--bg-card);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
}
.hero::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--f1-red);
}
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; margin: 0 0 0.6rem; }
.hero p { color: var(--text-secondary); font-size: 1rem; margin: 0; max-width: 540px; margin-inline: auto; }
</style></head>
<body class="dark"><div class="card-frame center">
  <div class="hero" style="width: 100%">
    <h1>Velkommen til F1 Klubben</h1>
    <p>Placér dit bet før løbet starter — én bet per løb, point for top-3 prediction, stjerne for en perfekt.</p>
  </div>
</div></body></html>
