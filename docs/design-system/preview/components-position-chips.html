<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
  .stack { display:flex; flex-direction:column; gap: 14px; }
  .variant { display:flex; align-items:center; gap: 14px; }
  .variant .lbl {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase;
    min-width: 90px;
  }
  .meta {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    color: var(--text-muted);
  }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="label-tiny">Position chips · podium ranks</div>
  <div class="stack">
    <div class="variant">
      <span class="lbl">Numeric</span>
      <span class="position-badge position-1">1</span>
      <span class="position-badge position-2">2</span>
      <span class="position-badge position-3">3</span>
    </div>
    <div class="variant">
      <span class="lbl">Prefixed</span>
      <span class="position-badge position-1">P1</span>
      <span class="position-badge position-2">P2</span>
      <span class="position-badge position-3">P3</span>
    </div>
  </div>
  <div class="meta">Pick one style per surface · 32 × 32 · radius 8 · Chivo 800</div>
</div></body></html>
