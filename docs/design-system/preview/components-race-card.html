<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.race {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 1.25rem 1.25rem 1rem;
}
.head { display:flex; justify-content:space-between; align-items: flex-start; gap: 12px; }
.title { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin-bottom: 0.4rem; }
.meta { display: flex; flex-wrap: wrap; gap: 14px; color: var(--text-secondary); font-size: 0.85rem; }
.meta span { display: inline-flex; align-items: center; gap: 0.35rem; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.muted { color: var(--text-muted); font-size: 0.85rem; }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="race">
    <div class="head">
      <div>
        <h3 class="title">Monaco Grand Prix</h3>
        <div class="meta">
          <span><span class="dot"></span> Monte Carlo</span>
          <span><span class="dot"></span> 24 May 2026 — 15:00 CET</span>
        </div>
      </div>
      <span class="badge status-open">Betting Open</span>
    </div>
    <div class="actions">
      <span class="muted">8 bets</span>
      <button class="btn btn-primary btn-sm">Place Bet</button>
    </div>
  </div>
</div></body></html>
