<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.tokens { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; }
.tok { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.bar { background: var(--f1-red); width: 100%; border-radius: 4px; }
.name { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--text-muted); }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="label-tiny">Spacing scale · 4-point base, expressed in rem</div>
  <div class="tokens">
    <div class="tok"><div class="bar" style="height:4px"></div><span class="name">1 · 4px</span></div>
    <div class="tok"><div class="bar" style="height:8px"></div><span class="name">2 · 8px</span></div>
    <div class="tok"><div class="bar" style="height:12px"></div><span class="name">3 · 12px</span></div>
    <div class="tok"><div class="bar" style="height:16px"></div><span class="name">4 · 16px</span></div>
    <div class="tok"><div class="bar" style="height:20px"></div><span class="name">5 · 20px</span></div>
    <div class="tok"><div class="bar" style="height:24px"></div><span class="name">6 · 24px</span></div>
    <div class="tok"><div class="bar" style="height:32px"></div><span class="name">8 · 32px</span></div>
  </div>
</div></body></html>
