<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.aa { font-family: var(--font-body); font-weight: 500; font-size: 56px; line-height: 1.05; letter-spacing: -0.01em; color: var(--text-primary); }
.aa-meta { display: flex; gap: 18px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-muted); }
.weights { display: flex; gap: 20px; align-items: baseline; }
.w { font-family: var(--font-body); font-size: 18px; }
.w400 { font-weight: 400; }
.w500 { font-weight: 500; }
.w600 { font-weight: 600; }
.w700 { font-weight: 700; }
.demo { font-family: var(--font-body); color: var(--text-secondary); font-size: 14px; line-height: 1.6; max-width: 540px; }
</style></head>
<body class="dark"><div class="card-frame">
    <div class="row" style="gap:18px; align-items: baseline;">
      <span class="aa">Manrope</span>
      <span class="label-tiny" style="font-size:12px">Body · labels · paragraph copy</span>
    </div>
    <div class="weights">
      <span class="w w400">Regular 400</span>
      <span class="w w500">Medium 500</span>
      <span class="w w600">Semibold 600</span>
      <span class="w w700">Bold 700</span>
    </div>
    <p class="demo">Velkommen til F1 Klubben — placér dit bet før løbet starter. Hver bruger kan kun have ét bet per løb, og samme kører kan ikke vælges flere gange.</p>
</div></body></html>
