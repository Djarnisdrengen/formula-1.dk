<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.specimen { display: flex; flex-direction: column; gap: 8px; }
.aa { font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: 0.95; letter-spacing: -0.02em; color: var(--text-primary); }
.aa-meta { display: flex; gap: 18px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-muted); }
.weights { display: flex; gap: 20px; align-items: baseline; }
.w { font-family: var(--font-display); font-size: 22px; }
.w400 { font-weight: 400; }
.w500 { font-weight: 500; }
.w700 { font-weight: 700; }
.w800 { font-weight: 800; }
.w900 { font-weight: 900; }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="specimen">
    <div class="row" style="gap:18px; align-items: baseline;">
      <span class="aa">Chivo</span>
      <span class="label-tiny" style="font-size:12px">Display · headings · buttons · badges</span>
    </div>
    <div class="weights">
      <span class="w w400">Regular 400</span>
      <span class="w w500">Medium 500</span>
      <span class="w w700">Bold 700</span>
      <span class="w w800">Heavy 800</span>
      <span class="w w900">Black 900</span>
    </div>
    <div class="aa-meta"><span>Google Fonts</span><span>--font-display</span><span>line-height 1.15</span></div>
  </div>
</div></body></html>
