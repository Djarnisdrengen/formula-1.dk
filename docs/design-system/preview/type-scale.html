<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.scale { display: grid; grid-template-columns: 80px 1fr; gap: 4px 18px; align-items: baseline; }
.lvl { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--text-muted); text-align: right; padding-top: 6px; }
.spec { font-family: var(--font-display); font-weight: 700; color: var(--text-primary); }
.b { font-family: var(--font-body); font-weight: 500; color: var(--text-primary); }
</style></head>
<body class="dark"><div class="card-frame">
  <div class="label-tiny">Type scale · used in headings + body</div>
  <div class="scale">
    <span class="lvl">hero 40</span><span class="spec" style="font-size:36px">Velkommen</span>
    <span class="lvl">h1 28</span><span class="spec" style="font-size:24px">Upcoming Races</span>
    <span class="lvl">h2 24</span><span class="spec" style="font-size:20px">Leaderboard</span>
    <span class="lvl">h3 20</span><span class="spec" style="font-size:18px">Monaco Grand Prix</span>
    <span class="lvl">body 16</span><span class="b" style="font-size:15px">Du har allerede placeret et bet.</span>
    <span class="lvl">small 14</span><span class="b" style="font-size:13px; color:var(--text-secondary)">Placed 3 days ago</span>
  </div>
</div></body></html>
