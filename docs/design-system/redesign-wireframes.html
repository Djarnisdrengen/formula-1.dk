<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Website redesign · wireframes (v0.1)</title>
<link rel="stylesheet" href="wireframe/style.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="font-family: Comfortaa">
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframe/primitives.jsx"></script>
<script type="text/babel" src="wireframe/nav.jsx"></script>
<script type="text/babel" src="wireframe/pages.jsx"></script>
<script type="text/babel" src="wireframe/admin.jsx"></script>
<script type="text/babel" src="wireframe/reference.jsx"></script>

<script type="text/babel">
  // Pull globals exposed by the JSX scripts
  const {
    NavAnatomy, NavScaling,
    PageHome, PageHomeDrawer, PageRaces, PageLeaderboard,
    PageRaceDetail, PageBetModal, PageRules, PageProfile, PageLogin,
    AdminMobile, AdminDesktop,
    BreakpointCard,
  } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "font": "elite"
  }/*EDITMODE-END*/;

  function App() {
    const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

    // Apply font tweak to <body> so the CSS var swap takes effect.
    React.useEffect(() => {
      document.body.classList.toggle('font-elite', tweaks.font === 'elite');
    }, [tweaks.font]);

    // Expose a global so the wireframe bottom-bar's "Aa" button can flip the
    // font without prop-drilling through every static page mockup.
    React.useEffect(() => {
      window.__toggleFont = () => setTweak('font', tweaks.font === 'elite' ? 'patrick' : 'elite');
      return () => { delete window.__toggleFont; };
    }, [tweaks.font, setTweak]);

    return (
      <>
        <TweaksPanel>
          <TweakSection label="Typography" />
          <TweakRadio
            label="Font"
            value={tweaks.font}
            options={['patrick', 'elite']}
            onChange={(v) => setTweak('font', v)}
          />
        </TweaksPanel>

        <DesignCanvas title="Website redesign · v0.1 wireframes" subtitle="Mobile-first · clubhouse newsletter aesthetic · F1 red accent · 5 breakpoints">
        <DCSection id="ref" title="00 · Reference · breakpoints &amp; grid">
          <DCArtboard id="ref-bp" label="Breakpoint scale &amp; grid rules" width={880} height={780}>
            <div style={{ padding: 30 }}>
              <BreakpointCard />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="nav" title="01 · Navigation system">
          <DCArtboard id="nav-anatomy" label="Anatomy · 3 pieces, separate zones" width={800} height={1080}>
            <div style={{ padding: 30 }}>
              <NavAnatomy />
            </div>
          </DCArtboard>
          <DCArtboard id="nav-scaling" label="Same shell at XS / SM / MD / LG / XL" width={900} height={980}>
            <div style={{ padding: 30 }}>
              <NavScaling />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="primary" title="02 · Primary pages (mobile first · 380px)">
          <DCArtboard id="home" label="Home · race hero + leaderboard preview" width={440} height={1000}>
            <div style={{ padding: 30 }}>
              <PageHome />
            </div>
          </DCArtboard>
          <DCArtboard id="home-drawer" label="Home · drawer open state" width={440} height={620}>
            <div style={{ padding: 30 }}>
              <PageHomeDrawer />
            </div>
          </DCArtboard>
          <DCArtboard id="races" label="Races · filterable list" width={440} height={820}>
            <div style={{ padding: 30 }}>
              <PageRaces />
            </div>
          </DCArtboard>
          <DCArtboard id="leaderboard" label="Leaderboard · self-row pinned" width={440} height={920}>
            <div style={{ padding: 30 }}>
              <PageLeaderboard />
            </div>
          </DCArtboard>
          <DCArtboard id="race-detail" label="Race detail · single race" width={440} height={840}>
            <div style={{ padding: 30 }}>
              <PageRaceDetail />
            </div>
          </DCArtboard>
          <DCArtboard id="bet-modal" label="Bet modal · full-screen on mobile" width={440} height={620}>
            <div style={{ padding: 30 }}>
              <PageBetModal />
            </div>
          </DCArtboard>
          <DCArtboard id="rules" label="Rules · numbered sections" width={440} height={920}>
            <div style={{ padding: 30 }}>
              <PageRules />
            </div>
          </DCArtboard>
          <DCArtboard id="profile" label="Profile · stats + my bets" width={440} height={780}>
            <div style={{ padding: 30 }}>
              <PageProfile />
            </div>
          </DCArtboard>
          <DCArtboard id="login" label="Login · pre-auth" width={440} height={700}>
            <div style={{ padding: 30 }}>
              <PageLogin />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="admin" title="03 · Admin · mobile + desktop">
          <DCArtboard id="admin-mobile" label="Admin · mobile · dropdown" width={440} height={860}>
            <div style={{ padding: 30 }}>
              <AdminMobile />
            </div>
          </DCArtboard>
          <DCArtboard id="admin-desktop" label="Admin · desktop · wrapping tabs" width={820} height={700}>
            <div style={{ padding: 30 }}>
              <AdminDesktop />
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
