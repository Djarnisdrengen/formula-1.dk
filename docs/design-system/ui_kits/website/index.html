<!doctype html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Klub · UI kit</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link rel="stylesheet" href="../../public/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
      /* Small additions the UI kit needs that aren't in style.css */
      .bet-modal-overlay.active { opacity: 1; visibility: visible; }
      .form-select { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem; font-family: 'Manrope', sans-serif; }

      /* ---------- Rules page ---------- */
      .rules-page { display: flex; flex-direction: column; gap: 2rem; }
      .rules-hero {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--accent-red);
        border-radius: 12px;
        padding: 2.25rem 2rem;
        position: relative;
        overflow: hidden;
      }
      .rules-hero::after {
        content: ""; position: absolute; top: -40px; right: -40px;
        width: 240px; height: 240px;
        background: radial-gradient(circle at center, rgba(225,6,0,0.18), transparent 60%);
        pointer-events: none;
      }
      .rules-hero-inner { position: relative; max-width: 720px; }
      .rules-eyebrow {
        display: inline-flex; align-items: center; gap: .5rem;
        font-family: 'Chivo', sans-serif; font-weight: 700;
        text-transform: uppercase; letter-spacing: .14em; font-size: .78rem;
        color: var(--accent-red); margin-bottom: .75rem;
      }
      .rules-hero h1 {
        font-family: 'Chivo', sans-serif; font-weight: 900;
        font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05;
        margin: 0 0 .75rem; letter-spacing: -0.01em;
      }
      .rules-hero p {
        color: var(--text-secondary); font-size: 1.05rem; line-height: 1.55;
        margin: 0 0 1.25rem; max-width: 56ch;
      }
      .rules-meta {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
        gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);
        color: var(--text-muted); font-size: .9rem;
      }
      .rules-meta .rules-actions { display: flex; gap: .5rem; }

      .rules-layout {
        display: grid; grid-template-columns: 240px 1fr; gap: 2.5rem;
        align-items: start;
      }
      @media (max-width: 880px) { .rules-layout { grid-template-columns: 1fr; } }

      .rules-toc {
        position: sticky; top: 88px;
        padding: 1rem; border: 1px solid var(--border-color);
        border-radius: 10px; background: var(--bg-card);
      }
      .rules-toc ul { list-style: none; padding: 0; margin: .75rem 0 0; display: flex; flex-direction: column; gap: .15rem; }
      .rules-toc a {
        display: flex; align-items: center; gap: .65rem;
        padding: .55rem .65rem; border-radius: 6px;
        color: var(--text-secondary); text-decoration: none; font-size: .92rem;
        border-left: 2px solid transparent;
        transition: background .15s, color .15s, border-color .15s;
      }
      .rules-toc a:hover { background: var(--bg-hover); color: var(--text-primary); }
      .rules-toc a.active {
        color: var(--text-primary); background: var(--bg-hover);
        border-left-color: var(--accent-red);
      }
      .rules-toc-num {
        font-family: 'Chivo', sans-serif; font-weight: 800; font-size: .7rem;
        width: 22px; height: 22px; border-radius: 4px;
        background: var(--bg-secondary); color: var(--text-muted);
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .rules-toc a.active .rules-toc-num { background: var(--accent-red); color: #fff; }

      .rules-body { display: flex; flex-direction: column; gap: 2.5rem; }
      .rules-section { scroll-margin-top: 100px; }
      .rules-section > header {
        display: flex; align-items: flex-start; gap: 1rem;
        padding-bottom: 1rem; margin-bottom: 1.25rem;
        border-bottom: 1px solid var(--border-color);
      }
      .rules-section-num {
        font-family: 'Chivo', sans-serif; font-weight: 900;
        font-size: 2.25rem; line-height: 1; color: var(--accent-red);
        letter-spacing: -0.02em; opacity: .95;
        font-variant-numeric: tabular-nums;
      }
      .rules-section h2 {
        font-family: 'Chivo', sans-serif; font-weight: 800;
        font-size: 1.5rem; margin: .25rem 0 0; letter-spacing: -0.005em;
      }
      .rules-section h2 i { color: var(--text-muted); margin-right: .35rem; font-size: 1.1rem; }

      .rules-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
      .rules-list li {
        display: grid; grid-template-columns: 56px 1fr; gap: .75rem;
        padding: .85rem 1rem; background: var(--bg-card);
        border: 1px solid var(--border-color); border-radius: 8px;
        line-height: 1.55; color: var(--text-secondary);
      }
      .rules-list .rules-num {
        font-family: 'Chivo', sans-serif; font-weight: 700;
        color: var(--text-muted); font-size: .9rem;
        font-variant-numeric: tabular-nums; padding-top: .05rem;
      }

      .rules-callout {
        margin-top: 1.5rem; padding: 1.25rem 1.5rem;
        background: linear-gradient(90deg, rgba(225,6,0,0.10), transparent 70%);
        border: 1px solid var(--border-color); border-left: 3px solid var(--accent-red);
        border-radius: 10px;
        display: flex; gap: 1rem; align-items: flex-start;
        color: var(--text-secondary); line-height: 1.5;
      }
      .rules-callout i { color: var(--accent-red); font-size: 1.25rem; margin-top: .15rem; }
      .rules-callout strong { color: var(--text-primary); }
    </style>
</head>
<body class="dark">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="data.js"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel">
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
